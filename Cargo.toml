[package]
name = "magit-lsp"
version = "0.1.0"
edition = "2021"

[lib]
name = "magit_lsp"
path = "src/lib.rs"

[[bin]]
name = "magit-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.25"

[dev-dependencies]
expect-test = "1"
tempfile = "3"
proptest = "1"

# Keep `target/` small: full debug info and incremental artifacts need far more
# disk than the test cycle benefits from.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false