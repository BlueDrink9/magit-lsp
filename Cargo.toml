[package]
name = "magit-lsp"
version = "0.2.0"
license = "GPL-3.0-only"
description = "A Git repository interface for editors over the Language Server Protocol"
repository = "https://github.com/BlueDrink9/magit-lsp"
readme = "README.md"
edition = "2021"

[lib]
name = "magit_lsp"
path = "src/lib.rs"

[[bin]]
name = "magit-lsp"
path = "src/main.rs"

[dependencies]
libc = "0.2"
getrandom = "0.4"
same-file = "1.0"
lsp-server = "0.10"
lsp-types = "0.97"
notify = "8.2"
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.25"
url = "2.5"

[dev-dependencies]
expect-test = "1"
proptest = "1"
rstest = "0.26"

# Keep `target/` small: full debug info and incremental artifacts need far more
# disk than the test cycle benefits from.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
