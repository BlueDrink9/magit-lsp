[package]
name = "magit-lsp"
version = "0.1.0"
edition = "2021"

[lib]
name = "magit_lsp"
path = "src/lib.rs"

[[bin]]
name = "magit-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"