name: Publish release artifacts

on:
  workflow_run:
    workflows:
      - Release artifact build (no publication)
    types: [completed]

permissions:
  contents: read

jobs:
  validate:
    name: Validate publication eligibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate workflow_run provenance and publication readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_automation.py --prepare-publication-runtime "$GITHUB_EVENT_PATH"

  publish:
    name: Publish (ineligible pending asset handoff)
    needs: validate
    # Only a successful push-tag build of this repository may reach the
    # environment. Manual dispatches and fork runs never publish; the validate
    # job still independently proves the tag/source binding before this runs.
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    environment: release-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      # This job remains unreachable until the collector can hand off validated
      # immutable assets. No external mutation or executable artifact is allowed.
