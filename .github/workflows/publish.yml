name: Publish release artifacts

on:
  workflow_run:
    workflows:
      - Release artifact build (no publication)
    types: [completed]

permissions:
  contents: read

jobs:
  validate:
    name: Validate publication eligibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      # The publish job downloads exactly this immutable artifact from this same
      # run; a name-only lookup or a cross-run pickup is never accepted.
      handoff_artifact_id: ${{ steps.handoff-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate workflow_run provenance and publication readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_automation.py --prepare-publication-runtime "$GITHUB_EVENT_PATH"
      # Only the handoff the runtime just validated, written by that runtime
      # alone, is persisted. The directory is data for the publisher: nothing
      # from it is checked out, imported or executed in either job.
      - id: handoff-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-handoff
          path: build/release/publication-handoff
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish validated handoff
    needs: validate
    # Only a successful push-tag build of this repository may reach the
    # environment. Manual dispatches and fork runs never publish; the validate
    # job still independently proves the tag/source binding before this runs.
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    environment: release-publish
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Download the validated handoff by immutable artifact id
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.validate.outputs.handoff_artifact_id }}
          path: build/release/publication-handoff
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Set up pinned pnpm
        run: corepack prepare pnpm@10.13.1 --activate
      - name: Install the frozen publication tooling
        run: make vscode-deps
      # The make target owns release creation and the OIDC registry lanes; this
      # job only hands it the exact downloaded bytes, and nothing here rebuilds,
      # repackages, installs a PAT or runs the crate lane.
      - name: Publish the validated handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-publish HANDOFF=build/release/publication-handoff/publication-handoff.json
