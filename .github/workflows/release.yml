
name: Release artifact build (no publication)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-x86_64-gnu:
    # Retain the older glibc baseline for Linux binary compatibility.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Validate tag and package versions
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python3 scripts/check_release_automation.py --validate-release-ref

      - name: Locked Linux GNU build
        run: cargo +1.94.1 build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package and smoke test actual binary
        run: |
          sh scripts/package-release.sh "$RELEASE_VERSION" target/x86_64-unknown-linux-gnu/release/magit-lsp dist
          PYTHONDONTWRITEBYTECODE=1 MAGIT_LSP_TEST_BINARY=target/x86_64-unknown-linux-gnu/release/magit-lsp python3 -m unittest discover -s tests/release -p 'test_*.py' -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-gnu-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
