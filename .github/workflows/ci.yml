name: CI

on:
  push:
  pull_request:

jobs:
  recommended-git:
    runs-on: ubuntu-latest
    container: rust:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated-container build dependencies
        run: apt-get update && apt-get install -y build-essential curl xz-utils zlib1g-dev
      - name: Build and test recommended Git 2.30.8
        run: scripts/test_recommended_git.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # TODO: cache the Rust target dir and Neovim once CI time matters.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The vscode keybinding drift check and node tests are part of
      # `make test`; install the locked dependencies first.
      - name: npm ci
        run: npm ci --prefix clients/vscode

      - name: make test
        run: make test

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Build first: the client starts the binary, and compiling inside the
      # harness's 15 s socket wait would time out.
      - name: make build
        run: make build

      - name: make ui-unit ui-test
        run: make ui-unit ui-test
        env:
          CI: "1"

      - name: upload UI artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artefacts
          path: build/ui/
