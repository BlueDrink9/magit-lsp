
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Provision the formatter tools explicitly: this job must not assume a Nix
      # dev shell is active. rustfmt matches the stable toolchain used by the
      # test job; the StyLua pin matches scripts/format.py and the flake package.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install pinned StyLua
        run: cargo install stylua --version 2.6.0 --locked

      - name: Install VSCode dependencies
        run: make vscode-deps

      - name: Check changed committed sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PR_BASE
          elif [ -z "$PUSH_BEFORE" ] || echo "$PUSH_BEFORE" | grep -Eq '^0+$'; then
            base=EMPTY_TREE
          else
            base=$PUSH_BEFORE
          fi
          python3 scripts/format.py --base "$base"

  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test download and packaging contracts (no Rust release build)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/release -p 'test_*.py' -v
          shellcheck scripts/install.sh scripts/package-release.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # TODO: cache the Rust target dir and Neovim once CI time matters.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      # The vscode Make target installs locked dependencies when needed.

      - name: make vscode-test
        run: make vscode-test

      - name: make test-rust test-lua
        run: make test-rust test-lua


  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          # cargo-llvm-cov drives llvm-cov/llvm-profdata from this component, so
          # the instrumentation matches the active rustc.
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      # The same target as local use. It runs the ordinary Rust suite under
      # instrumentation, so a failing test fails this job instead of yielding a
      # coverage report; the report and command log are still uploaded below.
      - name: make coverage-rust
        run: make coverage-rust

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: |
            build/coverage/lcov.info
            build/coverage/cargo-llvm-cov.log
            build/coverage/summary.txt
          if-no-files-found: warn

      # Rust-only upload. Secret-less runs (fork pull requests) skip this step
      # and keep the artifact above.
      - name: Upload Rust coverage to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: build/coverage/lcov.info
          flags: rust
          name: rust-linux
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true


  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: make docs-artifacts-check docs-check
        run: make docs-artifacts-check docs-check

  ui-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Build first: the client starts the binary, and compiling inside the
      # harness's 15 s socket wait would time out.
      - name: make build
        run: make build

      - name: make ui-unit ui-test
        run: make ui-unit ui-test
        env:
          CI: "1"

      - name: Upload UI artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-artefacts
          path: build/ui/


  # Test on other operating systems, just rust tests.
  native-test:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Rust
        run: cargo test --workspace --locked
