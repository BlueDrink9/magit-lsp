
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every Linux job body runs inside the flake's locked dev shell
      # (flake.lock), so rustfmt, StyLua, Node and pnpm come from one pinned
      # nixpkgs revision instead of ad hoc installs.
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - name: Install VSCode dependencies
        run: nix develop --no-update-lock-file -c make vscode-deps

      - name: Check changed committed sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PR_BASE
          elif [ -z "$PUSH_BEFORE" ] || echo "$PUSH_BEFORE" | grep -Eq '^0+$'; then
            base=EMPTY_TREE
          else
            base=$PUSH_BEFORE
          fi
          nix develop --no-update-lock-file -c python3 scripts/format.py --base "$base"

  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - name: Test download and packaging contracts (no Rust release build)
        run: nix develop --no-update-lock-file -c make release-contract-check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      # TODO: cache the Nix store once CI time matters.

      # The vscode Make target installs locked dependencies when needed.

      - name: make vscode-test
        run: nix develop --no-update-lock-file -c make vscode-test

      - name: make test-rust test-lua
        run: nix develop --no-update-lock-file -c make test-rust test-lua


  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      # cargo-llvm-cov and the LLVM tools come from the same locked dev shell, so
      # llvm-cov/llvm-profdata always match the rustc that instruments the tests.

      # The same target as local use. It runs the ordinary Rust suite under
      # instrumentation, so a failing test fails this job instead of yielding a
      # coverage report; the report and command log are still uploaded below.
      - name: make coverage-rust
        run: nix develop --no-update-lock-file -c make coverage-rust

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: |
            build/coverage/lcov.info
            build/coverage/cargo-llvm-cov.log
            build/coverage/summary.txt
          if-no-files-found: warn

      # Rust-only upload. Secret-less runs (fork pull requests) skip this step
      # and keep the artifact above.
      - name: Upload Rust coverage to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: build/coverage/lcov.info
          flags: rust
          name: rust-linux
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true


  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - name: make docs-artifacts-check docs-check
        run: nix develop --no-update-lock-file -c make docs-artifacts-check docs-check

  ui-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      # Build first: the client starts the binary, and compiling inside the
      # harness's 15 s socket wait would time out.
      - name: make build
        run: nix develop --no-update-lock-file -c make build

      - name: make ui-unit ui-test
        run: nix develop --no-update-lock-file -c env CI=1 make ui-unit ui-test

      - name: Upload UI artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-artefacts
          path: build/ui/


  # Test on other operating systems, just rust tests. These lanes stay on each
  # runner's native toolchain: Nix has no native Windows support, and the lanes
  # exist to cover native OS behavior, so they are a deliberate exception to the
  # locked Linux shell rather than a claim of Nix coverage.
  native-test:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Rust
        run: cargo test --workspace --locked
